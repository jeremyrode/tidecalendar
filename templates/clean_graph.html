<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ location_name }} Tide Chart</title>
  <link rel="stylesheet" href="clean_graph.css">
</head>
<body>

  <!-- Pure Full-Screen Tide Graph (Extra Large Fonts across 1600x1200 Display) -->
  <main class="chart-container">
    <svg viewBox="0 0 1600 1200" xmlns="http://www.w3.org/2000/svg">

      <!-- Chart Base Canvas (Pure White: 255, 255, 255) -->
      <rect x="{{ chart.chart_left }}" y="{{ chart.chart_top }}" width="{{ chart.chart_width }}" height="{{ chart.chart_height }}" fill="#ffffff" />

      <!-- Night Shading Left (Pure White: 255, 255, 255) -->
      <rect x="{{ chart.chart_left }}" y="{{ chart.chart_top }}" width="{{ chart.sunrise_x - chart.chart_left }}" height="{{ chart.chart_height }}" fill="#ffffff" />

      <!-- Daylight Background Shading (Pure Yellow: 255, 255, 0) -->
      <rect x="{{ chart.sunrise_x }}" y="{{ chart.chart_top }}" width="{{ chart.sunset_x - chart.sunrise_x }}" height="{{ chart.chart_height }}" fill="#ffff00" />
      <line x1="{{ chart.sunrise_x }}" y1="{{ chart.chart_top }}" x2="{{ chart.sunrise_x }}" y2="{{ chart.chart_bottom }}" stroke="#000000" stroke-width="4" stroke-dasharray="8 6"/>
      <line x1="{{ chart.sunset_x }}" y1="{{ chart.chart_top }}" x2="{{ chart.sunset_x }}" y2="{{ chart.chart_bottom }}" stroke="#000000" stroke-width="4" stroke-dasharray="8 6"/>

      <!-- Night Shading Right (Pure White: 255, 255, 255) -->
      <rect x="{{ chart.sunset_x }}" y="{{ chart.chart_top }}" width="{{ chart.chart_right - chart.sunset_x }}" height="{{ chart.chart_height }}" fill="#ffffff" />

      <!-- Horizontal Height Gridlines & Extra Large Y-Axis Labels -->
      {% for grid in chart.y_grids %}
      <line x1="{{ chart.chart_left }}" y1="{{ grid.y }}" x2="{{ chart.chart_right }}" y2="{{ grid.y }}"
            stroke="#000000"
            stroke-width="{{ '5' if grid.is_zero else '2.5' }}"
            stroke-dasharray="{{ '10 8' if grid.is_zero else '4 4' }}" />
      <text x="{{ chart.chart_left - 24 }}" y="{{ grid.y + 15 }}" text-anchor="end"
            font-size="{{ '52' if grid.is_zero else '46' }}"
            font-weight="900"
            fill="#000000">{{ grid.label }}</text>
      {% endfor %}

      <!-- Vertical Time Gridlines & Extra Large X-Axis Labels -->
      {% for tick in chart.x_ticks %}
      <line x1="{{ tick.x }}" y1="{{ chart.chart_top }}" x2="{{ tick.x }}" y2="{{ chart.chart_bottom }}" stroke="#000000" stroke-width="2" stroke-dasharray="4 4" />
      <text x="{{ tick.x }}" y="{{ chart.chart_bottom + 75 }}" text-anchor="middle" font-size="46" font-weight="900" fill="#000000">{{ tick.label }}</text>
      {% endfor %}

      <!-- Daylight Header Badges (Positioned above chart top to prevent curve overlap) -->
      <g>
        <rect x="{{ chart.sunrise_x + 6 }}" y="{{ chart.chart_top - 46 }}" width="250" height="42" rx="10" fill="#ffff00" stroke="#000000" stroke-width="3" />
        <text x="{{ chart.sunrise_x + 131 }}" y="{{ chart.chart_top - 16 }}" text-anchor="middle" font-size="26" font-weight="900" fill="#000000" letter-spacing="0.5">SUNRISE {{ solar.sunrise_str }}</text>

        <rect x="{{ chart.sunset_x - 256 }}" y="{{ chart.chart_top - 46 }}" width="250" height="42" rx="10" fill="#ffff00" stroke="#000000" stroke-width="3" />
        <text x="{{ chart.sunset_x - 131 }}" y="{{ chart.chart_top - 16 }}" text-anchor="middle" font-size="26" font-weight="900" fill="#000000" letter-spacing="0.5">SUNSET {{ solar.sunset_str }}</text>
      </g>

      <!-- Main Wave Harmonic Curve (Thick Pure Blue: 0, 0, 255) -->
      <path d="{{ chart.line_path }}" fill="none" stroke="#0000ff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Extrema Callout Pills on Curve (Extra Large Fonts: 36px / 26px) -->
      {% for ext in chart.extrema_svg %}
        <!-- Connector line for low tides offset to the side -->
        {% if not ext.is_high %}
        <line x1="{{ ext.cx }}" y1="{{ ext.cy }}" x2="{{ ext.pill_x }}" y2="{{ ext.pill_y }}"
              stroke="#0000ff" stroke-width="3" stroke-dasharray="6 4" />
        {% endif %}

        <!-- Circle point on the wave -->
        <circle cx="{{ ext.cx }}" cy="{{ ext.cy }}" r="15"
                fill="{{ '#ff0000' if ext.is_high else '#0000ff' }}"
                stroke="#ffffff" stroke-width="4" />

        <!-- Pill Box (Pure White Fill: 255,255,255 with Pure Red/Blue Stroke) -->
        <g transform="translate({{ ext.pill_x }}, {{ ext.pill_y }})">
          <rect x="-115" y="-36" width="230" height="72" rx="15"
                fill="#ffffff"
                stroke="{{ '#ff0000' if ext.is_high else '#0000ff' }}"
                stroke-width="4.5" />
          <text x="0" y="-4" text-anchor="middle" font-size="36" font-weight="900"
                fill="{{ '#ff0000' if ext.is_high else '#0000ff' }}">
            {{ '▲' if ext.is_high else '▼' }} {{ ext.height_str }}
          </text>
          <text x="0" y="25" text-anchor="middle" font-size="26" font-weight="900" fill="#000000">
            {{ ext.time_str }}
          </text>
        </g>
      {% endfor %}
    </svg>
  </main>

</body>
</html>
